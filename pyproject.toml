[project]
name = "atp"
version = "0.1.0"
description = "Agentic AI Trading Platform - a multi-agent AI trading assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "anthropic>=0.116",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "backtesting>=0.6.6",
    "optuna>=4.9.0",
]

[project.scripts]
atp = "atp.interfaces.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pre-commit>=3.7",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atp"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
    "RUF", # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*", "backtesting", "backtesting.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: requires a running TimescaleDB (docker compose up -d)",
]

[tool.coverage.run]
source = ["atp"]
